name: Torwarttraining – Bitte um An-/Abmeldung

# Nur per repository_dispatch "gk-signup-request" aus der App (neues Torwarttraining oder
# "Trainer erinnern"). Die Mail enthält keine Spielernamen.

on:
  repository_dispatch:
    types: [gk-signup-request]

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: E-Mails senden
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/send-gk-request.mjs
