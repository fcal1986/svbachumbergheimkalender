name: fussball.de Heimspiele synchronisieren

on:
  schedule:
    # Alle 6 Stunden. Bewusst nicht häufiger, um fussball.de nicht unnötig zu belasten.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Ausführliches Debug-Log ausgeben (bei Problemen aktivieren)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: fussball.de Heimspiele abrufen
        env:
          FUSSBALLDE_DEBUG: ${{ (github.event.inputs.debug || 'false') == 'true' && '1' || '0' }}
        run: node scripts/fussballde-sync.mjs

      - name: Änderungen committen (falls vorhanden)
        run: |
          git config user.name "platzcoach-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/fussballde.json; then
            echo "Keine Änderungen an den Heimspielen – kein Commit nötig."
          else
            git add data/fussballde.json
            git commit -m "Heimspiele von fussball.de aktualisiert"
            git push
          fi

      # Verlegungen, Abweichungen von Vormerkungen, neue und entfallene Spiele per Mail an die
      # betroffenen Trainer (und Admins). Die Datei schreibt scripts/fussballde-sync.mjs nur bei Änderungen.
      - name: Trainer über Änderungen bei fussball.de informieren
        if: hashFiles('fussballde-changes.json') != ''
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PLATZCOACH_CHANGES_FILE: fussballde-changes.json
        run: node scripts/notify-email.mjs
