name: Push-Erinnerung an offene Zusagen

# Täglich gegen 17 Uhr (Berlin): Push an Zugänge, die auf einen Trainer-Termin in zwei Tagen noch
# nicht geantwortet haben. Nur aktiv, wenn das Secret VAPID_PRIVATE_KEY gesetzt ist.

on:
  schedule:
    - cron: '7 15 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
      - name: Erinnerungen senden
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node scripts/push-reminders.mjs
