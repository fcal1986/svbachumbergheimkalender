name: Passwort-E-Mail bei neuem Zugang

# Läuft NICHT bei einem normalen Push/Commit, sondern nur, wenn die App gezielt ein
# "repository_dispatch"-Event mit dem Typ "welcome-password" auslöst (siehe index.html,
# Funktion ghDispatch). Dadurch landet das Passwort nie in einer Datei oder Commit-Nachricht.

on:
  repository_dispatch:
    types: [welcome-password]

jobs:
  send-password:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      # Zusätzliche Absicherung: registriert den Passwort-Wert bei GitHub Actions als
      # "geheim", sodass er in Log-Ausgaben automatisch durch *** ersetzt würde, falls er
      # doch irgendwo unbeabsichtigt ausgegeben werden sollte.
      - name: Passwort für Logs maskieren
        run: echo "::add-mask::${{ github.event.client_payload.password }}"

      - name: Passwort-E-Mail senden
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PAYLOAD_NAME: ${{ github.event.client_payload.name }}
          PAYLOAD_EMAIL: ${{ github.event.client_payload.email }}
          PAYLOAD_PASSWORD: ${{ github.event.client_payload.password }}
        run: node scripts/send-welcome-password.mjs
